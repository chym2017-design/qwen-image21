<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>换装/换脸方案对照实验台</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('qwz_theme')||'light'}catch(e){}</script>
<style>
  :root,:root[data-theme="light"]{--bg:#f5f6f8;--card:#fff;--line:#e2e5ea;--txt:#1a1d24;--dim:#6b7280;--acc:#2563eb;--onacc:#fff;--onbg:#e8effd;--ok:#16a34a;--err:#dc2626}
  :root[data-theme="dark"]{--bg:#101216;--card:#1a1d24;--line:#2a2f3a;--txt:#e8eaef;--dim:#9aa3b2;--acc:#6ea8fe;--onacc:#0b1220;--onbg:#1e2735;--ok:#3ecf8e;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC",sans-serif}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
  .topbar .brand{font-weight:700;font-size:16px}.topbar .grow{flex:1}
  .topbar button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 18px 80px}
  .desc{color:var(--dim);font-size:13px;margin:0 0 14px}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .slot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .slot h3{margin:0 0 8px;font-size:14px}
  .slot .ph{height:150px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;overflow:hidden;background:var(--bg)}
  .slot .ph img{width:100%;height:100%;object-fit:contain}
  .slot .ops{display:flex;gap:6px;margin-top:8px}
  .slot .ops button{flex:1;padding:6px 0;font-size:12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
  .slot .ops button:hover{border-color:var(--acc)}
  .cfg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .cfg .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .cfg label{font-size:13px;color:var(--dim);margin-right:6px}
  .cfg select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:14px}
  .cfg input[type=checkbox]{accent-color:var(--acc)}
  .cfg .lab{display:flex;align-items:center;gap:5px;font-size:13px}
  #runBtn{padding:10px 18px;font-size:15px;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);cursor:pointer}
  #clearBtn{padding:10px 14px;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .presets button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;cursor:pointer}
  .presets button:hover{border-color:var(--acc)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cell .head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .cell .head .t{font-size:12.5px;font-weight:600;flex:1}
  .cell .head button{padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:11px}
  .cell .head button:hover{border-color:var(--acc)}
  .cell .img{min-height:200px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  .cell .img img{width:100%;height:auto;display:block}
  .cell .msg{padding:6px 10px;font-size:11.5px;color:var(--dim)}
  .cell .met{padding:6px 10px;font-size:11.5px;color:var(--ok);border-top:1px dashed var(--line)}
  #bigview{display:none;position:fixed;inset:0;background:rgba(6,8,12,.95);z-index:60;overflow:auto}
  #bigview.on{display:block}
  .bvbar{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:rgba(6,8,12,.92)}
  .bvbar .bvt{flex:1;color:#e8eaef;font-size:14px}
  .bvbar button{padding:8px 14px;border-radius:9px;border:1px solid #3a4150;background:#1a1d24;color:#e8eaef;cursor:pointer;font-size:14px}
  #bigview img{display:block;margin:8px auto 40px;max-width:96vw;max-height:88vh;object-fit:contain;border-radius:8px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
  #toast.on{opacity:1}#toast.err{background:var(--err);color:#fff}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">换装/换脸对照实验台（非生成式）</span>
  <span class="grow"></span>
  <button id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>
<div class="wrap">
  <p class="desc">选方案+选项，点「运行并追加」——结果累加在下方（互不覆盖，每格可单独重跑/删除），并显示客观指标。所有方案均为经典视觉路线（OpenCV/insightface/rembg/gfpgan），不用生成式 AI 出图。</p>
  <div class="slots">
    <div class="slot"><h3>人像图（换脸源 / 被换装者）</h3><div class="ph" id="ph_person">未选图</div>
      <div class="ops"><button onclick="useSample('person')">用样图</button><button onclick="upload('person')">上传</button></div>
      <input type="file" id="file_person" accept="image/*" style="display:none"></div>
    <div class="slot"><h3>模特·衣服图（被换脸 / 衣服源）</h3><div class="ph" id="ph_model">未选图</div>
      <div class="ops"><button onclick="useSample('model')">用样图</button><button onclick="upload('model')">上传</button></div>
      <input type="file" id="file_model" accept="image/*" style="display:none"></div>
    <div class="slot"><h3>背景图（方案2.1 用）</h3><div class="ph" id="ph_bg">未选图</div>
      <div class="ops"><button onclick="useSample('bg')">用样图</button><button onclick="upload('bg')">上传</button></div>
      <input type="file" id="file_bg" accept="image/*" style="display:none"></div>
  </div>

  <div class="cfg">
    <div class="row">
      <label>主体</label>
      <select id="base" style="min-width:290px">
        <option value="person">人像图（把「衣服图」的衣/发 贴上或生成到人像）</option>
        <option value="clothes">衣服图（保留模特衣服，换人像的 脸/发）</option>
      </select>
      <label class="lab"><input type="checkbox" id="face">换脸</label>
      <label class="lab"><input type="checkbox" id="hair">换发型</label>
      <label>换背景</label>
      <select id="bgmode"><option value="keep">保留原背景</option><option value="input">换成背景图(第3张)</option></select>
    </div>
    <div class="row">
      <label>融合</label>
      <select id="blend"><option value="feather">羽化(推荐)</option><option value="poisson">泊松NORMAL</option><option value="poisson_mixed">泊松MIXED</option></select>
      <label>生成式换装</label>
      <select id="gen"><option value="off">关（AR 贴图）</option><option value="local">本地 ComfyUI（~1-2分钟）</option><option value="cloud">云端百炼（~10-30s, ¥0.1）</option></select>
      <label class="lab"><input type="checkbox" id="crop">抠图生成(贴回原背景)</label>
      <button id="runBtn" onclick="runCurrent()">运行并追加</button>
      <button id="clearBtn" onclick="clearGrid()">清空结果</button>
    </div>
    <div style="color:var(--dim);font-size:12px;margin-top:8px">「生成式换装」仅当 主体=人像图 时生效。换脸/换发型 = 把「另一张图」的脸/发型加到主体上。融合方式用于 AR 贴图（羽化最清晰）。</div>
  </div>

  <div class="presets" id="presets"></div>

  <div id="grid"></div>
</div>
<div id="bigview">
  <div class="bvbar"><span class="bvt" id="bvTitle">结果</span>
    <button onclick="bvNewTab()">🔍 新标签页打开</button>
    <button onclick="bvClose()">关闭</button></div>
  <img id="bvImg">
</div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let slots = {person:null, model:null, bg:null};
function applyTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('qwz_theme',t)}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
applyTheme(document.documentElement.dataset.theme||'light');
let tt=null;
function toast(m,e){const t=$('toast');t.textContent=m;t.className='on'+(e?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)}
function setSlot(name, dataUrl){const ph=$('ph_'+name);ph.innerHTML='<img src="'+dataUrl+'" style="cursor:zoom-in" title="点击放大">';const im=ph.querySelector('img');if(im)im.onclick=()=>openBig(name, dataUrl);}
async function useSample(name){try{const blob=await (await fetch('/api/sample?name='+name)).blob();setSlot(name, URL.createObjectURL(blob));slots[name]=await blobToB64(blob);toast('已载入样图：'+name)}catch(e){toast('载入失败',true)}}
function upload(name){$('file_'+name).click()}
['person','model','bg'].forEach(name=>{$('file_'+name).onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{setSlot(name, rd.result);slots[name]=rd.result.split(',')[1];toast('已上传')};rd.readAsDataURL(f)}});
function blobToB64(blob){return new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result.split(',')[1]);rd.readAsDataURL(blob)})}

/* ---------- 选项 ---------- */
function currentOptions(){ return {base:$('base').value, face:$('face').checked, hair:$('hair').checked, bg:$('bgmode').value, blend:$('blend').value, gen:$('gen').value, crop:$('crop').checked}; }
function configLabel(o){
  return '主体=' + (o.base==='person'?'人像':'衣服图')
    + (o.face?' 换脸':'') + (o.hair?' 换发型':'') + (o.bg!=='keep'?' 换背景':'')
    + ' 生成=' + ({off:'关(AR贴图)',local:'本地',cloud:'云端'}[o.gen]||o.gen) + (o.crop?'+抠图贴回':'') + ' 融合=' + o.blend;
}

/* ---------- 结果累加 ---------- */
let seq=0;
function openBig(title, src){ $('bvTitle').textContent = title || '结果'; $('bvImg').src = src; $('bigview').classList.add('on'); }
function bvClose(){ $('bigview').classList.remove('on'); }
function dataNewTab(src){ if(!src) return; fetch(src).then(r => r.blob()).then(b => window.open(URL.createObjectURL(b), '_blank')).catch(e => toast('打开失败:' + e, true)); }
function bvNewTab(){ dataNewTab($('bvImg').src); }
function cellNewTab(id){ const im = $(''+id).querySelector('.img img'); if(im) dataNewTab(im.src); }
function addCell(label,opts,result,msg,metrics){
  const id='cell'+(seq++);
  const cell=document.createElement('div');cell.className='cell';cell.id=id;
  cell.dataset.cfg=JSON.stringify({method:opts._method,options:opts._options});
  let met='';if(metrics&&Object.keys(metrics).length)met=Object.entries(metrics).map(([k,v])=>`${k}:${v}`).join('　');
  const body = result
    ? `<img src="data:image/png;base64,${result}" style="cursor:zoom-in" title="点击放大">`
    : `<span style="color:var(--err);padding:20px">${msg||'失败'}</span>`;
  cell.innerHTML=`<div class="head"><span class="t">${label}</span>${result?`<button onclick="cellNewTab('${id}')">🔍新标签</button>`:''}<button onclick="rerunCell('${id}')">重跑</button><button onclick="delCell('${id}')">删</button></div><div class="img">${body}</div><div class="msg">${msg||''}</div>${met?`<div class="met">${met}</div>`:''}`;
  const im = cell.querySelector('.img img');
  if (im) im.onclick = () => openBig(label, im.src);
  $('grid').prepend(cell);
}
function delCell(id){$(''+id).remove()}
async function rerunCell(id){
  const cell=$(''+id);const cfg=JSON.parse(cell.dataset.cfg);
  toast('重跑中…');
  const r=await doRun(cfg.method,cfg.options);
  if(r){ const label=cell.querySelector('.t').textContent; cell.remove(); addCell(label,cfg,r.result,r.msg,r.metrics); }
}
async function doRun(method,options){
  if((method==='tryon'||method==='face_swap')&&(!slots.person||!slots.model)){toast('请先备好 人像图+模特图',true);return null}
  if(method==='composite'&&(!slots.person||!slots.model||!slots.bg)){toast('方案2.1 需三张图',true);return null}
  try{
    const r=await (await fetch('/api/proc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,person:slots.person,model:slots.model,bg:slots.bg,options})})).json();
    if(r.error){toast(r.error,true);return {result:null,msg:r.error,metrics:{}}}
    return r;
  }catch(e){toast('请求失败:'+e,true);return null}
}
async function runCurrent(){
  const o = currentOptions();
  toast('处理中：' + configLabel(o));
  const r = await doRun('compose', o);
  if (r) { addCell(configLabel(o), {_method:'compose', _options:o}, r.result, r.msg, r.metrics); toast('完成'); }
}
function clearGrid(){$('grid').innerHTML='';toast('已清空')}

/* ---------- 快捷对照预设 ---------- */
const PRESETS=[
  ['人像·贴衣服(羽化)',{base:'person',face:false,hair:false,bg:'keep',blend:'feather',gen:'off'}],
  ['人像·贴衣+发(羽化)',{base:'person',face:false,hair:true,bg:'keep',blend:'feather',gen:'off'}],
  ['人像·生成换装(本地)',{base:'person',face:false,hair:false,bg:'keep',blend:'feather',gen:'local'}],
  ['人像·抠图生成(本地·贴回背景)',{base:'person',face:false,hair:false,bg:'keep',blend:'feather',gen:'local',crop:true}],
  ['人像·生成换装(云端)',{base:'person',face:false,hair:false,bg:'keep',blend:'feather',gen:'cloud'}],
  ['衣服·换脸',{base:'clothes',face:true,hair:false,bg:'keep',blend:'feather',gen:'off'}],
  ['衣服·换脸+发',{base:'clothes',face:true,hair:true,bg:'keep',blend:'feather',gen:'off'}],
  ['衣服·换脸+发+换背景',{base:'clothes',face:true,hair:true,bg:'input',blend:'feather',gen:'off'}],
];
function renderPresets(){
  const all=document.createElement('button');all.textContent='▶ 全部预设对照';all.style.borderColor='var(--acc)';all.style.color='var(--acc)';
  all.onclick=async()=>{for(const[label,o] of PRESETS){toast('处理中：'+label);const r=await doRun('compose',o);if(r)addCell(label,{_method:'compose',_options:o},r.result,r.msg,r.metrics);}toast('全部完成')};
  $('presets').appendChild(all);
  PRESETS.forEach(([label,o])=>{
    const b=document.createElement('button');b.textContent=label;
    b.onclick=async()=>{toast('处理中：'+label);const r=await doRun('compose',o);if(r){addCell(label,{_method:'compose',_options:o},r.result,r.msg,r.metrics);toast('完成')}};
    $('presets').appendChild(b);
  });
}

renderPresets();
['person','model','bg'].forEach(name=>useSample(name));
</script>
</body>
</html>
